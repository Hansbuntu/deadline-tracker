<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the whole screen; the CSS keeps
         content clear of the notch and home bar with safe-area padding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A personal tracker for art open calls, residencies and grants, with deadline alerts." />
    <!-- Colours the phone's status bar to match the page, in light and dark mode -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <!-- Icons: browser tab, older browsers, and the iPhone/iPad home screen -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iPhone: the name under the home-screen icon, and full-screen when opened from there -->
    <meta name="apple-mobile-web-app-title" content="Deadlines" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Deadlines (review copy)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
